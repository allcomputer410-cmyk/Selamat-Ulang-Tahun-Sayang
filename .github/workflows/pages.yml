# Setiap ada push ke main, isi main disalin ke branch gh-pages.
# GitHub Pages menayangkan branch gh-pages di:
#   https://<username>.github.io/<nama-repo>/
name: Sinkron ke gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push main ke gh-pages
        run: git push --force origin HEAD:gh-pages
